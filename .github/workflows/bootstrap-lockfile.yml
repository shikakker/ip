name: Bootstrap npm lockfile

on:
  push:
    branches: [portfolio-improvements-2026-08]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-improvements-2026-08
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regression contracts
        run: node --test tests/*.test.mjs
      - name: Resolve lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci --ignore-scripts
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
      - name: Commit verified dependency state
        run: |
          git config user.name 'Egor Denisov'
          git config user.email 'designer.egor@ya.ru'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git commit -m 'build: add verified npm lockfile'
          git push origin HEAD:portfolio-improvements-2026-08
