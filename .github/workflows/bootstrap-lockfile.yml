name: Quality

on:
  pull_request:
  push:
    branches: [main, portfolio-improvements-2026-08]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Regression tests
        run: npm run test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
